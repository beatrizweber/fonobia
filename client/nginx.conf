server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html,
    # pra o React Router assumir o roteamento no navegador (senão dar F5
    # em /perfil, /sobre etc. retorna 404 do nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
